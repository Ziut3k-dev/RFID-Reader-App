# Buduje instalatory na trzech systemach i publikuje je jako wydanie GitHuba.
#
# Uruchomienie:
#   git tag v1.0.0 && git push origin v1.0.0
# albo ręcznie z zakładki Actions (domyślnie bez tworzenia wydania).
#
# Każdy system buduje się na własnym runnerze — instalator .dmg wymaga macOS,
# a .exe Windowsa, więc budowanie wszystkiego na jednej maszynie nie jest
# możliwe bez obejść. Wydanie tworzy dopiero osobne zadanie, gdy wszystkie
# trzy paczki są gotowe.

name: Release

on:
  push:
    tags: ['v*']
  # Uruchomienie ręczne tylko buduje i zostawia paczki jako artefakty
  # przebiegu — wydanie powstaje wyłącznie z tagu.
  workflow_dispatch:

# Buildy potrzebują tylko odczytu; prawo zapisu dostaje wyłącznie zadanie
# tworzące wydanie (patrz permissions w zadaniu release).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (dmg, zip · arm64 + x64)
            os: macos-latest
            script: dist:mac
            pattern: |
              release/*.dmg
              release/*.zip
          - label: Windows (instalator, portable)
            os: windows-latest
            script: dist:win
            pattern: |
              release/*.exe
          - label: Linux (AppImage, deb, tar.gz)
            os: ubuntu-latest
            script: dist:linux
            pattern: |
              release/*.AppImage
              release/*.deb
              release/*.tar.gz

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Electron i narzędzia pakujące to kilkaset megabajtów pobierane przy
      # każdym buildzie — cache skraca przebieg o kilka minut.
      - name: Cache pobranych plików Electrona
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - run: npm ci

      # Wersja w package.json musi zgadzać się z tagiem — inaczej pliki
      # w wydaniu miałyby inny numer niż samo wydanie.
      - name: Sprawdź zgodność wersji z tagiem
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME nie zgadza się z wersją w package.json ($pkg)."
            exit 1
          fi
          echo "Wersja $pkg zgodna z tagiem."

      - run: npm run typecheck
      - run: npm test

      - name: Zbuduj instalatory
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-instalatory
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Wydanie GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pliki
          merge-multiple: true

      - name: Lista plików wydania
        run: ls -lh pliki

      # Wydanie tworzy gh CLI (jest na runnerze) w pętli z ponawianiem.
      # API GitHuba potrafi zwrócić przelotny błąd 5xx — bez ponowienia
      # przepadałby cały przebieg razem z trzema zbudowanymi platformami.
      - name: Utwórz szkic wydania i wyślij paczki
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          cat > notatki.md <<'NOTES'
          Instalatory czytnika RFID dla trzech systemów.

          | System | Plik |
          | --- | --- |
          | macOS (Apple Silicon) | `*-mac-arm64.dmg` |
          | macOS (Intel) | `*-mac-x64.dmg` |
          | Windows | `RFID-Scanner-Setup-*.exe` (instalator) lub `*-Portable-*.exe` |
          | Linux | `*.AppImage`, `*.deb` lub `*.tar.gz` |

          Paczki nie są podpisane certyfikatem, dlatego przy pierwszym
          uruchomieniu system pokaże ostrzeżenie:

          * **macOS** — kliknij aplikację prawym przyciskiem i wybierz „Otwórz”,
            albo wykonaj
            `xattr -dr com.apple.quarantine "/Applications/RFID Scanner.app"`.
          * **Windows** — w oknie SmartScreen wybierz „Więcej informacji”,
            następnie „Uruchom mimo to”.
          * **Linux (AppImage)** — nadaj prawo wykonywania:
            `chmod +x RFID-Scanner-*.AppImage`.
          NOTES

          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Wydanie $TAG już istnieje — dokładam pliki."
              break
            fi
            if gh release create "$TAG" --repo "$REPO" --draft \
                 --title "RFID Scanner $TAG" --notes-file notatki.md; then
              echo "Utworzono szkic wydania $TAG."
              break
            fi
            echo "::warning::Próba $attempt utworzenia wydania nie wyszła, ponawiam."
            sleep $((attempt * 15))
          done

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Nie udało się utworzyć wydania $TAG."
            exit 1
          fi

          for attempt in 1 2 3; do
            if gh release upload "$TAG" pliki/* --repo "$REPO" --clobber; then
              echo "Paczki wysłane."
              exit 0
            fi
            echo "::warning::Próba $attempt wysłania paczek nie wyszła, ponawiam."
            sleep $((attempt * 15))
          done

          echo "::error::Nie udało się wysłać paczek do wydania $TAG."
          exit 1
