# Konfiguracja pakowania aplikacji (electron-builder 26).
# Budowanie: npm run dist:mac | dist:win | dist:linux
# Wynik trafia do katalogu release/.

appId: pl.siecportali.rfidscanner
productName: RFID Scanner
copyright: © 2026 k.wlodarski

directories:
  output: release
  buildResources: build

# Do paczki trafia tylko to, co aplikacja naprawdę uruchamia.
# Katalog shared/ jest obowiązkowy — electron/main.js importuje z niego
# logikę odczytu; jego pominięcie kończy się błędem modułu po instalacji.
files:
  - electron/**/*
  - shared/**/*
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.md'

asar: true
# Brak zależności produkcyjnych i modułów natywnych — przebudowa jest zbędna.
npmRebuild: false
# Publikowaniem zajmuje się workflow release.yml — zbiera gotowe pliki
# i tworzy wydanie GitHuba. Własny publisher electron-buildera jest wyłączony;
# przy włączonym generuje jeszcze metadane auto-aktualizacji (latest.yml),
# których ta aplikacja nie używa, a których budowanie wywraca build Windowsa.
publish: null

artifactName: RFID-Scanner-${version}-${os}-${arch}.${ext}

# --- macOS -------------------------------------------------------------------
mac:
  category: public.app-category.utilities
  icon: build/icon.png
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Budowanie bez certyfikatu Apple Developer. Aby podpisać i notaryzować,
  # usuń tę linię i ustaw zmienne CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
  identity: null
  # Aplikacja nie sięga do kamery, mikrofonu ani plików użytkownika —
  # czytnik jest zwykłą klawiaturą USB, więc nie potrzeba uprawnień.
  extendInfo:
    LSApplicationCategoryType: public.app-category.utilities

dmg:
  title: RFID Scanner ${version}
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

# --- Windows -----------------------------------------------------------------
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RFID Scanner
  artifactName: RFID-Scanner-Setup-${version}.${ext}

portable:
  artifactName: RFID-Scanner-Portable-${version}-${arch}.${ext}

# --- Linux -------------------------------------------------------------------
linux:
  icon: build/icon.png
  category: Utility
  maintainer: k.wlodarski <k.wlodarski@siecportali.pl>
  synopsis: Obsługa czytnika RFID USB 13,56 MHz (ISO14443A)
  description: >-
    Rejestracja odczytów kart zbliżeniowych z czytnika USB HID,
    baza kart z uprawnieniami i dziennik wejść.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
  # Przepisuje desktopName z package.json do wpisu .desktop jako StartupWMClass,
  # dzięki czemu menedżer okien kojarzy działające okno z ikoną w doku.
  syncDesktopName: true
  desktop:
    entry:
      Keywords: rfid;nfc;mifare;iso14443a;czytnik;

deb:
  priority: optional
