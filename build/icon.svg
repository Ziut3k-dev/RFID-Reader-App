<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ikona aplikacji: ten sam motyw fali RFID co znak w nagłówku okna. -->
  <defs>
    <linearGradient id="tlo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b96ff"/>
      <stop offset="0.55" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#7b4dff"/>
    </linearGradient>
    <linearGradient id="blask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tlo)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#blask)"/>

  <!-- karta zbliżeniowa -->
  <rect x="176" y="368" width="392" height="288" rx="40"
        fill="none" stroke="#ffffff" stroke-width="34" stroke-opacity="0.92"/>
  <rect x="248" y="440" width="132" height="96" rx="18" fill="#ffffff" fill-opacity="0.55"/>

  <!-- fale odczytu -->
  <g fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round">
    <path d="M646 424a124 124 0 0 1 0 176" stroke-opacity="0.95"/>
    <path d="M726 366a204 204 0 0 1 0 292" stroke-opacity="0.66"/>
    <path d="M806 308a284 284 0 0 1 0 408" stroke-opacity="0.36"/>
  </g>
</svg>
